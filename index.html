<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0d0d">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon192.png">
<link rel="apple-touch-icon" href="icon192.png">
<title>Alpha 台美股 AI</title>
<style>
:root{--page:#0d0d0d;--surface:#1a1a19;--s2:#232322;--s3:#2c2c2a;--ink:#fff;--ink2:#c3c2b7;--ink3:#898781;--line:rgba(255,255,255,.10);--accent:#3987e5;--up:#e66767;--down:#199e70}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif;font-size:14px;-webkit-font-smoothing:antialiased}
#app{max-width:480px;margin:0 auto;min-height:100dvh;padding:0 16px 92px}
header{padding:calc(env(safe-area-inset-top) + 12px) 2px 8px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:700;font-size:17px}.brand span{color:var(--accent)}
.pill{font-size:11px;color:var(--ink2);background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h3{font-size:12px;color:var(--ink3);letter-spacing:.5px;margin-bottom:8px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.card h3 .mini{color:var(--accent);font-size:11px;font-weight:500}
.row{display:flex;align-items:center;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border:0}.row .nm{flex:1;min-width:0}.row .nm b{font-size:14.5px;display:block}.row .nm span{font-size:11px;color:var(--ink3)}
.row .px{text-align:right;min-width:96px}.row .px b{font-size:14.5px;font-variant-numeric:tabular-nums;display:block}
.tag{font-size:11px;padding:2px 7px;border-radius:6px;font-weight:600;font-variant-numeric:tabular-nums;display:inline-block;margin-top:2px}
.u{color:var(--up)}.d{color:var(--down)}.tag.u{background:rgba(230,103,103,.16)}.tag.d{background:rgba(25,158,112,.16)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.facts .f{background:var(--s2);border-radius:10px;padding:10px 12px}
.facts .f span{font-size:10.5px;color:var(--ink3);display:block;margin-bottom:2px}.facts .f b{font-size:15px;font-variant-numeric:tabular-nums}
.search{display:flex;gap:8px;margin:2px 0 12px}
.search input{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px 14px;color:var(--ink);font-size:16px;font-family:inherit}
.search button{background:var(--accent);border:0;border-radius:11px;color:#fff;padding:0 20px;font-weight:700;font-family:inherit;font-size:15px}
nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:rgba(13,13,13,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px)}
nav button{flex:1;background:none;border:0;color:var(--ink3);font-size:11px;font-family:inherit;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button.on{color:var(--accent)}nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.screen{display:none}.screen.on{display:block;animation:fade .18s ease}@keyframes fade{from{opacity:.5}to{opacity:1}}
.back{background:none;border:0;color:var(--accent);font-size:13px;font-family:inherit;padding:6px 2px}
.big{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.muted{font-size:11.5px;color:var(--ink3);margin-top:4px}
.loading{color:var(--ink3);font-size:13px;text-align:center;padding:20px}
.err{color:var(--up);font-size:12px;text-align:center;padding:12px}
.ai{background:linear-gradient(160deg,#16233a,#1a1a19 75%);border:1px solid rgba(57,135,229,.3)}
.ai .tag2{display:inline-block;font-size:10.5px;color:#9ec5f4;background:rgba(57,135,229,.16);border-radius:99px;padding:2px 8px;margin-bottom:8px;font-weight:600}
.ai p{font-size:13px;color:var(--ink2);line-height:1.5}.ai b{color:var(--ink)}
.wl-edit{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.chip{background:var(--s2);border:1px solid var(--line);border-radius:99px;padding:5px 10px;font-size:12px;display:flex;align-items:center;gap:6px}
.chip button{background:none;border:0;color:var(--ink3);font-size:14px;cursor:pointer}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--s3);border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body><div id="app">
<header>
  <div class="brand">Alpha<span>◆</span> <span style="font-size:11px;color:var(--ink3);font-weight:400">台美股 AI</span></div>
  <span class="pill" id="status">載入中…</span>
</header>

<!-- 今日 -->
<section class="screen on" id="scr-home">
  <div class="card"><h3>自選股 <span class="mini" onclick="show('watch')">編輯 →</span></h3><div id="wl"><div class="loading"><span class="spin"></span> 抓取即時報價…</div></div></div>
  <div class="card"><h3>三大法人買超前 5 <span class="mini" id="instdate">—</span></h3><div id="topbuy"><div class="loading"><span class="spin"></span></div></div></div>
  <div class="card"><h3>三大法人賣超前 5</h3><div id="topsell"></div></div>
  <div class="muted" style="text-align:center">資料來源：FinMind · 下拉重新整理請重開 App</div>
</section>

<!-- 個股 -->
<section class="screen" id="scr-stock">
  <div class="search"><input id="q" placeholder="輸入代號，例 2454" inputmode="numeric" enterkeyhint="search"><button onclick="lookup()">查</button></div>
  <div id="detail"><div class="muted" style="text-align:center;padding:30px">輸入台股代號查詢<br>估值 · 月營收 · 三大法人</div></div>
</section>

<!-- 編輯自選股 -->
<section class="screen" id="scr-watch">
  <button class="back" onclick="show('home')">‹ 返回</button>
  <div class="card"><h3>管理自選股</h3>
    <div class="search"><input id="addcode" placeholder="新增代號，例 2308" inputmode="numeric"><button onclick="addWL()">加入</button></div>
    <div class="wl-edit" id="wledit"></div>
  </div>
</section>

<nav>
  <button class="on" id="nav-home" onclick="show('home')"><svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>今日</button>
  <button id="nav-stock" onclick="show('stock')"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg>個股</button>
  <button id="nav-watch" onclick="show('watch')"><svg viewBox="0 0 24 24"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.6l1-5.8L3.5 9.7l5.9-.9z"/></svg>自選</button>
</nav></div>

<script>
const API="https://api.finmindtrade.com/api/v4/data";
const DEFAULT_WL=["2330","2317","2454","2308","1513","3231"];
let WL=load("alpha_wl",DEFAULT_WL);
const cache={};
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function daysAgo(n){const d=new Date(Date.now()-n*864e5);return d.toISOString().slice(0,10)}
const fmt=n=>n==null||isNaN(n)?'—':Number(n).toLocaleString();
const zhang=n=>n==null||isNaN(n)?'—':(n>=0?'+':'')+Math.round(n/1000).toLocaleString()+' 張';

async function fm(dataset,id,start){
  const key=dataset+id+start;
  if(cache[key])return cache[key];
  const url=`${API}?dataset=${dataset}&data_id=${id}&start_date=${start}`;
  const r=await fetch(url);
  const j=await r.json();
  const data=(j&&j.data)||[];
  cache[key]=data;return data;
}

// ── 今日：自選股報價 ──
async function loadHome(){
  document.getElementById('status').textContent='更新中…';
  const wlEl=document.getElementById('wl');
  wlEl.innerHTML='';
  let ok=0;
  for(const code of WL){
    const div=document.createElement('div');div.innerHTML=`<div class="row"><div class="nm"><b>${code}</b><span><span class="spin"></span></span></div></div>`;
    wlEl.appendChild(div);
    try{
      const px=await fm('TaiwanStockPrice',code,daysAgo(10));
      if(px.length){
        const last=px[px.length-1];
        const prev=px.length>1?px[px.length-2].close:last.close-last.spread;
        const chg=last.spread!=null?last.spread:(last.close-prev);
        const pct=prev?(chg/prev*100):0;
        const cls=chg>=0?'u':'d';
        div.innerHTML=`<div class="row" onclick="openStock('${code}')"><div class="nm"><b>${code}</b><span>${last.date}</span></div>
          <div class="px"><b>${fmt(last.close)}</b><span class="tag ${cls}">${chg>=0?'+':''}${(+chg).toFixed(1)} (${pct>=0?'+':''}${pct.toFixed(2)}%)</span></div></div>`;
        ok++;
      }else div.innerHTML=`<div class="row" onclick="openStock('${code}')"><div class="nm"><b>${code}</b><span>無報價</span></div></div>`;
    }catch(e){div.innerHTML=`<div class="row"><div class="nm"><b>${code}</b><span style="color:var(--up)">讀取失敗</span></div></div>`}
  }
  if(!WL.length)wlEl.innerHTML='<div class="muted" style="padding:10px">尚無自選股，到「自選」新增</div>';
  document.getElementById('status').textContent='已更新 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'});
  loadInstLeaders();
}

// ── 今日：法人買超/賣超前 5（用自選股算，避免打太多 API）──
async function loadInstLeaders(){
  const rows=[];
  for(const code of WL){
    try{
      const inst=await instNet(code);
      if(inst&&inst.total!=null)rows.push({code,name:inst.name,v:inst.foreign,date:inst.date});
    }catch(e){}
  }
  rows.sort((a,b)=>b.v-a.v);
  const buy=rows.slice(0,5),sell=rows.slice().reverse().slice(0,5);
  document.getElementById('instdate').textContent=rows[0]?rows[0].date:'—';
  const rr=o=>`<div class="row" onclick="openStock('${o.code}')"><div class="nm"><b>${o.name||o.code}</b><span>${o.code} · 外資</span></div><div class="px"><b class="${o.v>=0?'u':'d'}">${zhang(o.v)}</b></div></div>`;
  document.getElementById('topbuy').innerHTML=buy.length?buy.map(rr).join(''):'<div class="muted" style="padding:8px">—</div>';
  document.getElementById('topsell').innerHTML=sell.length?sell.map(rr).join(''):'<div class="muted" style="padding:8px">—</div>';
}

// ── 法人淨額計算 ──
async function instNet(code){
  const raw=await fm('TaiwanStockInstitutionalInvestorsBuySell',code,daysAgo(12));
  if(!raw.length)return null;
  const last=raw[raw.length-1].date;
  const day=raw.filter(r=>r.date===last);
  let foreign=0,trust=0,dealer=0,cname='';
  for(const r of day){
    const net=(r.buy||0)-(r.sell||0);
    const n=r.name||'';
    if(n.includes('Foreign'))foreign+=net;
    else if(n.includes('Investment_Trust')||n.includes('Trust'))trust+=net;
    else if(n.includes('Dealer'))dealer+=net;
  }
  return {date:last,foreign,trust,dealer,total:foreign+trust+dealer,name:cname};
}

// ── 個股詳情 ──
async function openStock(code){
  show('stock');document.getElementById('q').value=code;
  const el=document.getElementById('detail');
  el.innerHTML='<div class="loading"><span class="spin"></span> 抓取 '+code+' 資料…</div>';
  try{
    const [px,per,rev,inst]=await Promise.all([
      fm('TaiwanStockPrice',code,daysAgo(10)),
      fm('TaiwanStockPER',code,daysAgo(10)),
      fm('TaiwanStockMonthRevenue',code,daysAgo(400)),
      instNet(code)
    ]);
    if(!px.length){el.innerHTML='<div class="err">查無此代號的資料（'+code+'）</div>';return}
    const last=px[px.length-1];
    const prev=px.length>1?px[px.length-2].close:last.close-last.spread;
    const chg=last.spread!=null?last.spread:(last.close-prev);
    const pct=prev?(chg/prev*100):0;const cls=chg>=0?'u':'d';
    const p=per.length?per[per.length-1]:{};
    // 月營收 + YoY
    let revHtml='—',revYoY='';
    if(rev.length){
      const r=rev[rev.length-1];
      const yoyRow=rev.find(x=>x.revenue_year===r.revenue_year-1&&x.revenue_month===r.revenue_month);
      const yoy=yoyRow?((r.revenue-yoyRow.revenue)/yoyRow.revenue*100):null;
      revHtml=`${r.revenue_year}/${String(r.revenue_month).padStart(2,'0')} ${fmt(Math.round(r.revenue/1000))}仟`;
      if(yoy!=null)revYoY=` <span class="${yoy>=0?'u':'d'}">YoY ${yoy>=0?'+':''}${yoy.toFixed(1)}%</span>`;
    }
    let aiParts=[];
    if(rev.length){const r=rev[rev.length-1];const yr=rev.find(x=>x.revenue_year===r.revenue_year-1&&x.revenue_month===r.revenue_month);if(yr){const y=(r.revenue-yr.revenue)/yr.revenue*100;aiParts.push(`最新月營收 YoY ${y>=0?'+':''}${y.toFixed(1)}%`)}}
    if(inst)aiParts.push(`外資近日${inst.foreign>=0?'買超':'賣超'} ${zhang(Math.abs(inst.foreign)).replace('+','')}`);
    if(p.PER)aiParts.push(`本益比 ${p.PER}`);
    el.innerHTML=`
      <button class="back" onclick="show('home')">‹ 返回</button>
      <div class="card"><div class="big ${cls}">${fmt(last.close)} <span style="font-size:15px">${chg>=0?'+':''}${(+chg).toFixed(1)} (${pct>=0?'+':''}${pct.toFixed(2)}%)</span></div>
        <div class="muted">${code} · 收盤日 ${last.date}</div></div>
      <div class="card"><h3>估值</h3><div class="facts">
        <div class="f"><span>本益比 PER</span><b>${p.PER??'—'}</b></div>
        <div class="f"><span>淨值比 PBR</span><b>${p.PBR??'—'}</b></div>
        <div class="f"><span>殖利率</span><b>${p.dividend_yield!=null?p.dividend_yield+'%':'—'}</b></div>
        <div class="f"><span>月營收${revYoY}</span><b style="font-size:13px">${revHtml}</b></div>
      </div></div>
      <div class="card"><h3>三大法人買賣超 ${inst?'· '+inst.date:''}</h3><div class="facts">
        <div class="f"><span>外資</span><b class="${inst&&inst.foreign>=0?'u':'d'}">${inst?zhang(inst.foreign):'—'}</b></div>
        <div class="f"><span>投信</span><b class="${inst&&inst.trust>=0?'u':'d'}">${inst?zhang(inst.trust):'—'}</b></div>
        <div class="f"><span>自營商</span><b class="${inst&&inst.dealer>=0?'u':'d'}">${inst?zhang(inst.dealer):'—'}</b></div>
        <div class="f"><span>三大法人合計</span><b class="${inst&&inst.total>=0?'u':'d'}">${inst?zhang(inst.total):'—'}</b></div>
      </div></div>
      ${aiParts.length?`<div class="card ai"><span class="tag2">✦ AI 速讀</span><p>${code}：${aiParts.join('、')}。<span style="color:var(--ink3)">（規則版摘要，非投資建議）</span></p></div>`:''}
      <div class="wl-edit"><button class="search" style="width:100%"><span></span></button></div>
      <div style="margin-top:4px"><button onclick="toggleWL('${code}')" style="width:100%;background:var(--s2);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font-family:inherit;font-size:14px">${WL.includes(code)?'從自選股移除':'＋ 加入自選股'}</button></div>`;
  }catch(e){el.innerHTML='<div class="err">讀取失敗：'+e.message+'<br>可能是 FinMind 額度暫時用滿，稍後再試</div>'}
}

function lookup(){const c=document.getElementById('q').value.trim();if(c)openStock(c)}
function toggleWL(code){if(WL.includes(code))WL=WL.filter(x=>x!==code);else WL.push(code);save('alpha_wl',WL);renderWLedit();openStock(code)}
function addWL(){const c=document.getElementById('addcode').value.trim();if(c&&!WL.includes(c)){WL.push(c);save('alpha_wl',WL);document.getElementById('addcode').value='';renderWLedit()}}
function renderWLedit(){document.getElementById('wledit').innerHTML=WL.map(c=>`<span class="chip">${c}<button onclick="rmWL('${c}')">✕</button></span>`).join('')||'<span class="muted">尚無自選股</span>'}
function rmWL(c){WL=WL.filter(x=>x!==c);save('alpha_wl',WL);renderWLedit()}

function show(s){
  document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));
  document.getElementById('scr-'+s).classList.add('on');
  ['home','stock','watch'].forEach(k=>document.getElementById('nav-'+k).classList.toggle('on',k===s));
  if(s==='home')loadHome();
  if(s==='watch')renderWLedit();
  window.scrollTo(0,0);
}
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});

// PWA
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
loadHome();
</script>
</body>
</html>
