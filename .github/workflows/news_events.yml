# 新聞與事件管線（2026-09-08 建置一.1）
#
# ⚠ 這個檔案**還沒 commit**：這台機器的 PAT 沒有 workflow scope，push 帶
#    .github/workflows/ 的變更會被 GitHub 拒絕。請總司令用有 workflow 權限的
#    權杖把它推上去，排程才會開始跑。在那之前可本機手動執行：
#      python .github/scripts/fetch_news_events.py
name: 新聞與事件

on:
  schedule:
    # 每 30 分鐘（總司令指定）。台股盤中與盤後公告都會即時進來。
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-events
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝相依
        run: pip install requests certifi urllib3
      - name: 抓新聞與事件
        run: python .github/scripts/fetch_news_events.py
      # 2026-09-09（題材驗證 v3.3）從 sitemap 收集連結。
      # 為什麼要獨立一步而且要盡早收：sitemap 是**滾動窗口，只保留 6~7 天**，
      # 實測 2026-09-01 以前的子 sitemap 一律 404。**今天沒收的連結明天就沒了。**
      # 這一步只抓 sitemap（4 個請求）不抓內文，很輕，但不做就會永久流失。
      - name: 從 sitemap 收集新聞連結
        run: python .github/scripts/fetch_news_sitemap.py
        continue-on-error: true
      # 2026-09-09（題材四）**題材庫接上排程。**
      # 在此之前 news_body_extract.py 與 build_themes.py 都不在任何 workflow 裡，
      # 題材庫只有人工跑才會動——跟「題材要常常更新」正好相反。
      # 額度計算：MAX_PER_RUN=200 × 每 30 分鐘 = 每日約 9,600 則，
      # 遠大於兩家 sitemap 每日新增量，積壓的約 3,200 則可在 8 小時內消化完。
      # 斷點續跑：已抓過的 URL 記在 news_evidence.json，每輪自動跳過。
      - name: 萃取新聞內文的題材句
        run: python .github/scripts/news_body_extract.py
        continue-on-error: true
      - name: 重建題材庫
        run: python scripts/build_themes.py
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/events.json data/news_urls.json data/news_evidence.json data/themes.json
          if git diff --cached --quiet; then
            echo "沒有新的新聞或事件，不產生 commit"
          else
            git commit -m "新聞與事件：更新 news.json / events.json（每 30 分鐘排程）"
            git pull --rebase --autostash
            git push
          fi
