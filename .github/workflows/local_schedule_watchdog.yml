# 本機排程停擺告警（2026-09-26 總司令裁示【警.一】，方向E）
#
# 為什麼放在雲端：本機排程一旦被git卡住（例如stash-pop衝突），連push都推不出去，
# 本機自己完全沒有管道通知任何人——這正是2026-09-26稽核發現「git stash-pop衝突
# 卡住push約5小時」事故的根因類型。偵測本身不能依賴本機還活著。
#
# 判定邏輯與IBKR排除理由見 scripts/check_local_schedule_heartbeat.py docstring；
# 這裡只做「每30分鐘跑一次、失敗就讓job變紅燈」——job變紅燈時GitHub會用內建的
# repo擁有者email通知，不需要另外設定任何token/webhook。
name: 本機排程停擺告警

on:
  schedule:
    # 2026-10-01（總司令裁示【先.九】三）避開整點／半點尖峰：原 */30（:00／:30）改為每小時 :23／:53，仍是每 30 分鐘一次。
    - cron: "23,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  # 先.一〇三-18：補救觸發 market.yml 用 workflow 自帶 GITHUB_TOKEN（workflow_dispatch 例外，會建立新 run），不需另建 token
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 兩條本機排程最密的時候約15分鐘一次commit；2000筆history已經是
          # 遠高於「找得到最近一次DevQueue/IBKR commit」所需的量，這裡抓
          # 更保守的深度，確保排程真的停擺數天時仍能找到「上一次還活著」
          # 的時間點，而不是因為checkout深度不夠就誤判成「完全沒有紀錄」。
          fetch-depth: 3000

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 檢查本機排程心跳（DevQueue commit時間），寫進STATUS.json
        id: heartbeat
        continue-on-error: true
        run: python scripts/check_local_schedule_heartbeat.py

      # 跟audit.yml同一套理由（if: always()）：即使上一步判定「停擺」而
      # exit 1，STATUS.json裡的心跳欄位還是要落地，不能因為要讓job變紅燈
      # 就放棄commit這次量到的診斷資訊——那樣總司令只看得到「紅燈」，看不到
      # 「停了幾分鐘、上一次是幾點」這些真正有用的細節。
      - name: Commit 心跳結果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 常備.開發-28：commit 前驗證 App 會讀的 JSON（schema），不過者還原上一版、不發布；
          # 守門員自身失敗只降級成警告（十二節）。報告 data/schema_guard/local_schedule_watchdog.json 單獨一行 git add（十節；
          # 寫報告失敗時檔案不存在，2>/dev/null || true 讓它不拖垮後面的 commit）。
          python scripts/data_schema_guard.py guard --report data/schema_guard/local_schedule_watchdog.json --label local_schedule_watchdog || true
          git add -- data/schema_guard/local_schedule_watchdog.json 2>/dev/null || true
          git add data/STATUS.json
          if git diff --cached --quiet; then
            echo "心跳欄位與上次相同，不產生 commit"
          else
            git commit -m "本機排程停擺告警：更新 STATUS.json 心跳欄位（每30分鐘排程）"
            # 2026-10-01（【先.九】二）rebase前先收走工作目錄殘留；已commit的資料不受影響。
            git stash push --include-untracked -m ci-leftovers || true
            git pull --rebase --autostash
            git push
          fi

      # 先.一〇三-18（2026-10-16 總司令裁示）：台北 17:45 後當天 market_tw 還沒落地就觸發 market.yml（一天最多 1 次）。
      # 條件與限制見 scripts/watchdog_dispatch_market.py docstring；自身失敗只警告、exit 0（十二節），排在 commit 之後、紅燈之前。
      - name: 台股主班未落地就補觸發 market.yml
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/watchdog_dispatch_market.py

      - name: 停擺就讓這個 job 顯示紅燈（觸發 GitHub email 與手機 App 的 Actions 失敗推播）
        if: steps.heartbeat.outcome == 'failure'
        run: |
          # 先.一〇二-3：告警文字依總司令指定；N 取 STATUS.json 的 stall_minutes（最新一筆本機心跳距今分鐘數）
          N=$(python -c "import json;v=json.load(open('data/STATUS.json',encoding='utf-8'))['local_schedule_heartbeat'].get('stall_minutes');print(int(v) if v is not None else '超過60')" 2>/dev/null || echo "超過60")
          echo "::error::本機停擺 ${N} 分鐘，可能是重開機未登入（DevQueue／市場補跑／連線監測皆無 60 分鐘內心跳；詳見 data/STATUS.json 的 local_schedule_heartbeat）"
          exit 1
