name: 盤中近即時報價（台股+美股）

# 2026-08-25 新增：FinMind 免費版只有盤後日線，App 畫面之前會在「盤中」狀態燈亮著的
# 時候顯示前一日收盤價，卻讓人以為是即時報價，這是誤導。這支 workflow 在台美股盤中
# 時段排程執行，抓近即時報價、寫成 data/quotes_tw.json / data/quotes_us.json 兩個
# 小檔案 commit 進 repo，App 端 fetch 這兩個檔案顯示，並誠實標示「延遲約 N 分鐘
# （GitHub Actions 排程）」，不標成即時——因為本質上還是有排程間隔的延遲，不是真正
# tick-by-tick 的即時報價。
#
# 【資安】台股資料源（TWSE MIS）不需要金鑰。美股資料源（Finnhub）需要金鑰，一律從
# GitHub Secrets 讀（secrets.FINNHUB_API_KEY），絕對不會出現在任何 commit 的檔案裡。
# 使用者要先在 repo Settings → Secrets and variables → Actions 新增這個 secret，
# 沒有設定的話美股報價這一步會失敗（不影響台股報價那一步，兩步獨立），錯誤訊息會
# 清楚寫在 Actions 執行紀錄裡，不會悄悄產生假資料。

on:
  schedule:
    # 台股盤中 UTC 01:00–05:30（台北時間 09:00–13:30），每10分鐘，週一至週五
    - cron: '0,10,20,30,40,50 1-4 * * 1-5'
    - cron: '0,10,20,30 5 * * 1-5'
    # 美股盤中 UTC 13:30–21:00（美東夏令 09:30–17:00 左右，涵蓋盤前到盤後一小段），每10分鐘，週一至週五
    - cron: '30,40,50 13 * * 1-5'
    - cron: '0,10,20,30,40,50 14-20 * * 1-5'
    - cron: '0 21 * * 1-5'
  workflow_dispatch: {}  # 允許手動在 GitHub 網頁上按「Run workflow」測試

permissions:
  contents: write  # 要 commit 回 repo，需要寫入權限

jobs:
  fetch-quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安裝相依套件
        run: pip install requests yfinance

      - name: 抓台股盤中報價（TWSE MIS，免金鑰）
        run: python .github/scripts/fetch_quotes_tw.py
        continue-on-error: true  # 2026-08-26 新增：台股這步萬一真的故障也不該拖累美股那步
        # 跟下面 commit 那步一起被跳過——兩邊各自獨立成敗，一邊掛掉不拖垮另一邊（使用者要求）。

      - name: 抓美股盤中報價（Finnhub，需要 FINNHUB_API_KEY secret）
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python .github/scripts/fetch_quotes_us.py
        continue-on-error: true  # 美股這步沒設金鑰時會失敗，不要讓它擋住台股那份已經抓到的資料被 commit

      - name: Commit 報價 JSON（有變動才 commit）
        if: always()  # 2026-08-26 新增：前面兩步不管誰失敗（即使兩個都失敗），只要有任何一份
        # 檔案真的寫出來了就要 commit——沒有這行，前面任一步驟(continue-on-error標成failure)
        # 仍會讓 GitHub 預設跳過後面步驟，等於已經抓到的資料白抓了。
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # -A 限定在 data/ 目錄下加，quotes_us.json 沒抓成功（美股那步失敗）時
          # 檔案不存在也不會讓這行報錯，不像明確列檔名那樣一個缺席就整行失敗。
          git add -A data/
          git diff --cached --quiet && echo "無變動，略過 commit" || git commit -m "自動更新盤中報價 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
