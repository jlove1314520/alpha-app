name: 大盤/類股/三大法人/期貨/美股指數

on:
  schedule:
    - cron: '10 6 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝相依套件
        run: pip install requests yfinance pandas numpy
      - name: 更新個股財報EPS/毛利率/營益率/ROE（TWSE官方t187ap06_L_ci/07_L_ci，免金鑰）
        # 這步要放最前面：它用t187ap06_L_ci「上市公司」名單建立 stock_detail.json
        # 的股票清單骨架，下面兩步（三大法人/融資融券）只合併「已存在於這份骨架」
        # 的代碼，濾掉ETF/權證等非股票證券噪音（見各腳本docstring）。
        run: python .github/scripts/update_stock_financials.py
        continue-on-error: true
      - name: 抓台股大盤/類股/三大法人/台指期（TWSE/TPEx/TAIFEX 官方開放資料，免金鑰）
        run: python .github/scripts/fetch_market_tw.py
        continue-on-error: true
      - name: 抓美股四大指數（yfinance，免金鑰）
        run: python .github/scripts/fetch_market_us.py
        continue-on-error: true
      - name: 更新個股月營收/PER/PBR/殖利率（TWSE官方openapi，累積式寫回，免金鑰）
        run: python .github/scripts/update_fundamentals_daily.py
        continue-on-error: true
      - name: 抓USD/TWD匯率（yfinance，免金鑰）
        run: python .github/scripts/fetch_fx.py
        continue-on-error: true
      - name: 更新大盤融資維持率+個股融資融券（TWSE官方MI_MARGN/STOCK_DAY_ALL，僅分母用FinMind）
        run: python .github/scripts/update_margin_maintenance.py
        continue-on-error: true
      - name: 更新個股OHLCV價量歷史（TWSE STOCK_DAY_ALL/TPEx tpex_mainboard_quotes，累積式寫回，免金鑰）
        run: python .github/scripts/update_price_history.py
        continue-on-error: true
      - name: 更新追蹤美股標的財報行事曆（yfinance，免金鑰）
        run: python .github/scripts/fetch_earnings_calendar.py
        continue-on-error: true
      # 2026-08-27新增：只讀repo內JSON（不讀parquet、不呼叫FinMind），解除「App核心
      # 功能綁在研究者本機」的架構風險，見 research/generate_scores_live.py 檔頭說明。
      # 放在上面幾步之後，才能用到當次剛更新的fundamentals.json/stock_detail.json。
      - name: 產生價值成長榜scores.json（JSON-only上線評分路徑）
        run: python research/generate_scores_live.py
        continue-on-error: true
      # 2026-08-27新增（策略層面決定：拆成兩個獨立榜單，不要用單一分數通吃）。
      # 因子/權重跟上面的價值成長榜完全獨立，各自版本控管（見
      # research/score_live_momentum.py檔頭說明）。回測驗證前，兩榜頁面都要
      # 顯示「本榜為資料排序，尚未經過組合策略回測驗證」的警語（見BACKLOG.md）。
      - name: 產生題材動能榜scores_momentum.json（JSON-only上線評分路徑）
        run: python research/generate_scores_momentum.py
        continue-on-error: true
      # 2026-08-27新增（第三個獨立濾網：未來性濾網(a)類因子，見BACKLOG.md B17）。
      # 跟另外兩榜物理分離、各自版本控管（見research/score_live_future.py）。
      - name: 產生未來性濾網scores_future.json（JSON-only上線評分路徑）
        run: python research/generate_scores_future.py
        continue-on-error: true
      - name: Commit 市場資料 JSON（有變動才 commit）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/market_tw.json data/market_us.json data/fundamentals.json data/fx.json data/margin_maintenance.json data/stock_detail.json data/price_history.json data/quotes_all_tw.json data/earnings_calendar.json scores.json scores_momentum.json scores_future.json
          git diff --cached --quiet && echo "無變動，略過 commit" || git commit -m "自動更新大盤/類股/三大法人/期貨/美股指數/個股基本面/匯率/融資維持率/個股財報籌碼/選股分數(價值成長+題材動能+未來性) $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
