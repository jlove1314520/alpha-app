name: 大盤/類股/三大法人/期貨/美股指數

on:
  schedule:
    # 2026-09-09（實測.十一）**台股班次從 14:10 移到 17:00／18:30。**
    #
    # 舊時間 cron '10 6' = UTC 06:10 = 台北 14:10。實測證明那個時間點
    # **永遠不可能成功**：2026-09-08 15:05（收盤後 95 分、排程後 55 分）
    # 直接打 TWSE T86 與 MI_MARGN 都回 total=0、
    # stat='很抱歉，沒有符合條件的資料'——證交所根本還沒發布。
    #
    # 依據：scripts/probe_twse_publish_time.py 自 2026-09-08 起每 15 分鐘實測，
    # 目前累積到的資料是 **T86 於 2026-09-08 最早在 16:15 取得成功**。
    # 探測解析度等於間隔（15 分），真正發布時間落在 16:00~16:15 之間。
    # 取 17:00 留 45 分鐘餘裕，18:30 再跑一次當補救
    # （若 17:00 那輪抓到的資料日期不是當日，18:30 會補上）。
    #
    # **誠實揭露：目前只有一個交易日的實測值**（總司令要求連續三個交易日）。
    # 探測器持續在跑，累積足夠後若發現 16:15 不具代表性會再調整。
    # 但 14:10 是已證明必敗的時間點，不需要等三天才改。
    #
    # 2026-10-01（總司令裁示【先.九】三）cron 避開整點／半點：實測 GitHub schedule
    # 派發延遲 4.5~8.6 小時（執行本身只要 2.8~9.4 分鐘），整點／半點是全站排程
    # 負載尖峰。原 '0 9'／'30 10'／'30 21' 分別改為 :13／:41／:43，三班次語意不變。
    - cron: '13 9 * * 1-5'     # 台北 17:13 — 台股主班次
    - cron: '41 10 * * 1-5'    # 台北 18:41 — 補救班次
    - cron: '43 21 * * 1-5'    # 台北隔日 05:43 — 美股班次
  workflow_dispatch:
    inputs:
      reason:
        # 先.一〇三-18：local_schedule_watchdog.yml 補救觸發時帶 watchdog_tw_catchup，跳過每日限 2 次的內部人轉讓步驟
        description: "觸發原因（手動留空即可）"
        required: false
        default: ""

permissions:
  contents: write

# 2026-08-28新增（系統性修正，取代單純push重試這個OK繃，跟quotes.yml共用
# 同一個concurrency group"repo-push-main"，讓兩支workflow「跨workflow」
# 排隊、同一時間只有一個在推main，見quotes.yml同一段註解的完整說明）。
concurrency:
  group: repo-push-main
  cancel-in-progress: false

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    # 先.一一〇-6（2026-10-18 總司令核准 先.一〇九-26）：近 30 次最長 8.5 分；逾時改判 failure、下一班照常跑
    timeout-minutes: 30
    # 先.一〇三-16：User-Agent 聯絡信箱改讀這個（選填 GitHub Secret）；沒設時腳本用專案佔位信箱，不再寫死個人 email
    env:
      ALPHA_UA_CONTACT: ${{ secrets.ALPHA_UA_CONTACT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝相依套件
        run: pip install requests yfinance pandas numpy
      - name: 更新個股財報EPS/毛利率/營益率/ROE（TWSE官方t187ap06_L_ci/07_L_ci，免金鑰）
        # 這步要放最前面：它用t187ap06_L_ci「上市公司」名單建立 stock_detail.json
        # 的股票清單骨架，下面兩步（三大法人/融資融券）只合併「已存在於這份骨架」
        # 的代碼，濾掉ETF/權證等非股票證券噪音（見各腳本docstring）。
        run: python .github/scripts/update_stock_financials.py
        continue-on-error: true
      - name: 抓台股大盤/類股/三大法人/台指期（TWSE/TPEx/TAIFEX 官方開放資料，免金鑰）
        run: python .github/scripts/fetch_market_tw.py
        continue-on-error: true
      - name: 抓美股四大指數（yfinance，免金鑰）
        run: python .github/scripts/fetch_market_us.py
        continue-on-error: true
      # 先.八十一-33：美股描述性篩選資料（yfinance 日線一次批次＋SEC frames 流通股數 4 次請求，每次 sleep 0.2 秒）。
      # 輸出 data/us_screener.json、data/us_daily/（先.一〇三-15d 個股日線檔）已加進下方 git add 清單（十節）；抓不到時不覆蓋舊檔、自身失敗只警告（十二）。
      - name: 美股篩選資料（成交額／漲跌幅／市值，描述性，非選股訊號）
        run: python .github/scripts/build_us_screener.py
        continue-on-error: true
      - name: 更新美股類股SIC對映（SEC EDGAR官方company_tickers/submissions，免金鑰，建置一.3）
        run: python .github/scripts/fetch_us_sic.py
        continue-on-error: true
      - name: 更新美股內部人交易（SEC EDGAR官方Form 4，免金鑰，源頭二.3第2名）
        run: python .github/scripts/fetch_us_insider_trading.py
        continue-on-error: true
      - name: 更新美股重大訊息（SEC EDGAR官方Form 8-K，免金鑰，PENDING_QUEUE「三」美股半邊）
        run: python .github/scripts/fetch_us_8k.py
        continue-on-error: true
      - name: 更新CFTC COT部位報告（美股大盤情緒指標，免金鑰，源頭二.3第3名）
        run: python .github/scripts/fetch_cftc_cot.py
        continue-on-error: true
      - name: 更新可借券賣出股數（TWSE官方SBL/TWT96U，免金鑰，源頭二.3第5名）
        run: python .github/scripts/fetch_short_lending_available.py
        continue-on-error: true
      - name: 累積可融券賣出餘額逐檔逐日歷史（零額外請求，稽核.三B組第3類之二）
        run: python .github/scripts/accumulate_short_lending_available.py
        continue-on-error: true
      - name: 更新借券賣出當日成交量（TWSE官方TWT93U＋TPEx官方tpex_short_sell，免金鑰，源頭一.2b）
        run: python .github/scripts/fetch_securities_lending_sell.py
        continue-on-error: true
      - name: 累積借券賣出逐檔逐日歷史（零額外請求，稽核.三B組第3類之一）
        run: python .github/scripts/accumulate_securities_lending_sell.py
        continue-on-error: true
      - name: 累積內部人持股轉讓事前申報（TWSE t187ap12_L＋TPEx mopsfin_t187ap12_O，各1次，只在05:43班，先.九十五-3）
        # 2026-10-14 總司令裁示先.九十五-3 核准：只跑台北 05:43 班、每日 2 請求；姓名／受讓人改雜湊只留職稱與身分類別。
        # 輸出 data/insider_transfer_tw_history.json 已加進下方 git add 清單（十節）；共用 rate_limit_state（已在清單）。
        # 自身失敗只警告、兩邊都失敗不覆蓋既有檔（十二）。
        # 先.一〇三-18：watchdog 補救觸發（reason=watchdog_tw_catchup）不跑本步驟，維持先.九十五-3 核准的每日 2 次請求
        if: github.event.schedule == '43 21 * * 1-5' || (github.event_name == 'workflow_dispatch' && inputs.reason != 'watchdog_tw_catchup')
        # 先.一〇三-19：姓名雜湊改 HMAC，金鑰只從 GitHub Secret 讀（總司令本人建立）；沒設時腳本不寫姓名雜湊
        env:
          INSIDER_HASH_KEY: ${{ secrets.INSIDER_HASH_KEY }}
        run: python .github/scripts/fetch_insider_transfer_tw.py
        continue-on-error: true
      - name: 更新SEC 13F機構持倉（僅追蹤波克夏海瑟威，免金鑰，源頭二.3第6名）
        run: python .github/scripts/fetch_us_13f_holdings.py
        continue-on-error: true
      - name: 更新BLS美國總經指標（失業率/CPI年增率/非農就業，免金鑰，源頭二.3第8名）
        run: python .github/scripts/fetch_bls_macro.py
        continue-on-error: true
      - name: 更新財政部關務署海關進出口貿易統計（免金鑰，源頭二.3第9名）
        run: python .github/scripts/fetch_customs_trade.py
        continue-on-error: true
      - name: 更新經濟部工業生產指數（免金鑰，源頭二.3第10名，僅生產指數未含外銷訂單）
        run: python .github/scripts/fetch_industrial_production.py
        continue-on-error: true
      - name: 更新個股月營收/PER/PBR/殖利率（TWSE官方openapi，累積式寫回，免金鑰）
        run: python .github/scripts/update_fundamentals_daily.py
        continue-on-error: true
      # 2026-09-08（金流一.1）法人歷史往前累積 → 產業金流聚合。兩支都零額外
      # 請求：只讀 stock_detail.json（上一步已經抓好的 T86/TPEx 結果）。
      # 必須排在 update_fundamentals_daily.py 之後，因為它依賴那支寫出的
      # institutional 欄位。近 60 交易日的 T86 落在 holdout，不回補（見腳本 docstring）。
      - name: 累積個股三大法人歷史（零額外請求，金流一.1）
        run: python .github/scripts/accumulate_institutional.py
        continue-on-error: true
      # 先.一二一-3：「聚合產業金流地圖」移到價量歷史寫入＋缺日補齊之後（見下方），
      # 因為法人 20 日均價／逆勢買超要用法人最新日當天的收盤價。
      - name: 抓USD/TWD匯率（yfinance，免金鑰）
        run: python .github/scripts/fetch_fx.py
        continue-on-error: true
      - name: 更新外資及陸資持股比率（TWSE官方MI_QFIIS，免金鑰，源頭二.3第1名）
        run: python .github/scripts/fetch_foreign_holding.py
        continue-on-error: true
      - name: 累積外資持股比率逐檔逐日歷史（零額外請求，稽核.三B組第1類）
        run: python .github/scripts/accumulate_foreign_holding.py
        continue-on-error: true
      - name: 更新個股OHLCV價量歷史（TWSE STOCK_DAY_ALL/TPEx tpex_mainboard_quotes，累積式寫回，免金鑰）
        run: python .github/scripts/update_price_history.py
        continue-on-error: true
      # 2026-09-15（sparklines凍結事件解封）：從price_history.json切出全市場走勢線，
      # 零額外網路請求。這一步2026-09-05功能剛做出來那天本來就該掛在這裡，
      # 卡了十天沒推上去是因為當時的PAT沒有workflow scope，見PENDING_QUEUE.md稽核.六。
      # 先.八十-9（2026-10-12）：全市場缺日補齊（只在偵測到缺日時才打 TWSE MI_INDEX／TPEx otc，每輪最多 10 天）＋缺日自測。
      # 寫入 data/price_history/（2026-10-13 先.八十二-1 拆檔，資料夾已在下方 git add 清單）。自身失敗只警告，不擋後續步驟（十二節）。
      - name: 全市場缺日補齊與自測（data/price_history.json）
        run: |
          python scripts/backfill_price_history_gaps.py || echo "::warning::price_history 缺日補齊未完成"
          python scripts/selftest_price_history_gaps.py || echo "::warning::price_history 仍有全市場缺日"
        continue-on-error: true
      # 先.一二一-3（2026-10-20）：從 accumulate_institutional.py 後面移到這裡。原本排在 update_price_history.py 之前，
      # price_history 還沒有法人最新日的收盤 → est_amount 用前一天收盤、逆勢買超／20 日均價價差算不出來。
      # 中間的匯率／外資持股兩步不讀寫 sector_flow.json，順序互不影響；仍在 build_by_code 之前，零額外請求。
      - name: 聚合產業金流地圖（零額外請求，金流一.1）
        run: python scripts/build_sector_flow.py
        continue-on-error: true
      # 先.九十七-R6（2026-10-15）：維持率步驟移到 price_history 寫入＋缺日補齊之後。晚上 STOCK_DAY_ALL 常仍是前一天，
      # 維持率要用 price_history 同日收盤補；排在前面時當天 price_history 還沒寫入 → 只跑一班（本機補跑／17:13 班）必定 data_incomplete
      # （10/14 實例：21:43 補跑 ratio=null，22:17 單獨重跑才得 191.61%）。中間的外資持股兩步不讀寫維持率檔，順序互不影響；計算與門檻不變。
      - name: 更新大盤融資維持率+個股融資融券（TWSE官方MI_MARGN/STOCK_DAY_ALL，2026-09-15起分母也改TWSE官方，零FinMind依賴）
        run: python .github/scripts/update_margin_maintenance.py
        continue-on-error: true
      - name: 累積個股融資融券逐檔逐日歷史（零額外請求，稽核.三B組第2類）
        run: python .github/scripts/accumulate_margin_by_stock.py
        continue-on-error: true
      - name: 產生全市場走勢線sparklines.json（從price_history切出，零額外請求）
        run: python .github/scripts/build_sparklines.py
        continue-on-error: true
      # 先.八十二-6（2026-10-13 總司令裁示⑤）：每日全市場「股價÷本益比」快照，只累積、不進評分。
      # 讀 fundamentals.json＋price_history（零額外請求）；輸出 data/pe_snapshot/<資料日>.json 已加進下方 git add（十節）。
      - name: 每日本益比快照（只累積，先.八十二-6）
        run: python scripts/build_pe_snapshot.py
        continue-on-error: true
      # 常備.開發-20（2026-10-11 先.六十七）：sparklines／quotes_all_tw／company_info 依代號拆成 data/quote_lite/
      # （首頁自選股列只抓用得到的代號）。零外部請求；輸出已加進下方 git add（十節）。自身失敗只警告（十二）。
      - name: 依代號拆分首頁報價小檔（零額外請求，常備.開發-20）
        run: python scripts/split_quote_lite.py
        continue-on-error: true
      - name: 更新追蹤美股標的財報行事曆（yfinance，免金鑰）
        run: python .github/scripts/fetch_earnings_calendar.py
        continue-on-error: true
      # 2026-08-27新增：只讀repo內JSON（不讀parquet、不呼叫FinMind），解除「App核心
      # 功能綁在研究者本機」的架構風險，見 research/generate_scores_live.py 檔頭說明。
      # 放在上面幾步之後，才能用到當次剛更新的fundamentals.json/stock_detail.json。
      - name: 產生價值成長榜scores.json（JSON-only上線評分路徑）
        run: python research/generate_scores_live.py
        continue-on-error: true
      # 2026-08-27新增（策略層面決定：拆成兩個獨立榜單，不要用單一分數通吃）。
      # 因子/權重跟上面的價值成長榜完全獨立，各自版本控管（見
      # research/score_live_momentum.py檔頭說明）。回測驗證前，兩榜頁面都要
      # 顯示「本榜為資料排序，尚未經過組合策略回測驗證」的警語（見BACKLOG.md）。
      - name: 產生題材動能榜scores_momentum.json（JSON-only上線評分路徑）
        run: python research/generate_scores_momentum.py
        continue-on-error: true
      # 2026-08-27新增（第三個獨立濾網：未來性濾網(a)類因子，見BACKLOG.md B17）。
      # 跟另外兩榜物理分離、各自版本控管（見research/score_live_future.py）。
      - name: 產生未來性濾網scores_future.json（JSON-only上線評分路徑）
        run: python research/generate_scores_future.py
        continue-on-error: true
      # 2026-08-28新增（B24第一步，使用者原話「今晚就要開始累積快照，鐵律：
      # 只能事前快照嚴禁事後補建」）：三榜都產生完之後、commit之前，快照
      # 各榜Top20進data/picks_ledger.json——前瞻選股台帳，不是回測。
      - name: 快照三榜Top20進前瞻選股台帳picks_ledger.json
        run: python .github/scripts/build_picks_ledger.py
        continue-on-error: true
      # 2026-09-01新增（update_picks_ledger_returns.py從骨架補完實作）：快照
      # 之後、commit之前，檢查每個既有快照是否到了T+5/20/60/120交易日，到了
      # 就回填實際報酬+大盤超額（yfinance ^TWII），只填還沒填過的欄位，鐵律
      # 「填過的欄位永遠不再更動」。
      - name: 回填前瞻選股台帳的T+N報酬（只算已發生的日子，嚴禁事後改既有快照）
        run: python .github/scripts/update_picks_ledger_returns.py
        continue-on-error: true
      # 2026-10-11（常備.開發-因子類-B19）：前瞻訊號台帳 data/signal_ledger.json。
      # 先事前寫入近 4 日 L1 重大訊息／L3 媒體訊號（append-only，不補建舊事件），
      # 再只回填 null 的進場價與 T+5/20/60。規格 research/B19_SIGNAL_LEDGER_SPEC.md。
      - name: B19 前瞻訊號台帳（事前寫入，嚴禁補建）
        run: python .github/scripts/build_signal_ledger.py
        continue-on-error: true
      - name: B19 前瞻訊號台帳回填（只填 null 欄位）
        run: python .github/scripts/update_signal_ledger_returns.py
        continue-on-error: true
      # 2026-08-29新增（策略監控台升級，使用者原話「forward paper嚴禁事後
      # 補建，只能逐日往前累積」）：三榜都產生完之後，逐日mark-to-market
      # 累積前向紙上模擬（不是回測，是真的每天用當天收盤價往前滾），
      # 寫data/strategy_performance.json；接著重跑generate_strategies_json.py
      # 把最新的forward_paper數字併回App實際讀的data/strategies.json，
      # 否則App會一直顯示產生當下（手動執行那次）的舊排行/舊曲線。
      - name: 更新策略前向紙上模擬performance（逐日累積，嚴禁回填）
        run: python research/update_strategy_performance.py
        continue-on-error: true
      - name: 重新產生策略監控台data/strategies.json（併入最新前向績效）
        run: python research/generate_strategies_json.py
        continue-on-error: true
      # 2026-09-27新增（紙.一，總司令裁示【新.二結案＋紙.一＋查.二放行】）：
      # 0050/定存70/30前進式紙上追蹤，非回測非新試驗，見
      # research/paper_7030_tracker.py檔頭說明。放在update_price_history.py
      # 之後才能吃到當次剛更新的0050收盤價；本身已在腳本內用
      # try/except包住主邏輯、失敗只印::warning::並exit 0（符合CLAUDE.md
      # 十二節「守門員自身失敗只能降級成警告」），這裡再加continue-on-error
      # 做雙重保險。
      - name: 更新紙.一 0050/定存70/30前進式紙上追蹤（非回測非新試驗）
        run: python research/paper_7030_tracker.py
        continue-on-error: true
