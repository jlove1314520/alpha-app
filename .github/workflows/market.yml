name: 大盤/類股/三大法人/期貨/美股指數

on:
  schedule:
    - cron: '10 6 * * 1-5'
    - cron: '30 21 * * 1-5'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-market:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安裝相依套件
        run: pip install requests yfinance
      - name: 抓台股大盤/類股/三大法人/台指期（TWSE/TPEx/TAIFEX 官方開放資料，免金鑰）
        run: python .github/scripts/fetch_market_tw.py
        continue-on-error: true
      - name: 抓美股四大指數（yfinance，免金鑰）
        run: python .github/scripts/fetch_market_us.py
        continue-on-error: true
      - name: Commit 市場資料 JSON（有變動才 commit）
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/market_tw.json data/market_us.json
          git diff --cached --quiet && echo "無變動，略過 commit" || git commit -m "自動更新大盤/類股/三大法人/期貨/美股指數 $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
