          git add -f research/data/paper_8_log.jsonl 2>/dev/null || true
          git add -f research/data/paper_8_taiex_closes.json 2>/dev/null || true
          # 先.六十九-3：commit 訊息註明 quote_lite（兩層：熱門單檔＋分片）本次變動檔數
          QL=$(git diff --cached --name-only -- data/quote_lite | wc -l | tr -d ' ')
          git diff --cached --quiet && echo "無變動，略過 commit" || git commit -m "自動更新大盤/類股/三大法人/期貨/美股指數/個股基本面/匯率/融資維持率/個股財報籌碼/選股分數(價值成長+題材動能+未來性)/前瞻選股台帳 $(date -u +'%Y-%m-%d %H:%M UTC')（quote_lite 變動 ${QL} 檔）"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "push成功（第${i}次嘗試）"
              exit 0
            fi
            echo "push失敗，可能跟其他寫入者（quotes.yml/AlphaMarathon）撞在一起，第${i}次，fetch+rebase後重試"
            # 2026-10-01（【先.九】二）rebase前先把工作目錄殘留（未追蹤／未暫存）收進stash，
            # 避免"cannot rebase: You have unstaged changes"擋住重試；已commit的資料不受影響。
            git stash push --include-untracked -m ci-leftovers || true
            git fetch origin main
            git rebase origin/main || { echo "rebase衝突，放棄自動解決"; git rebase --abort; exit 1; }
            sleep $((RANDOM % 6 + 3))
          done
          echo "重試5次後仍push失敗"
          exit 1
