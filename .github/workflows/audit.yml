# 每晚全市場資料一致性稽核（2026-09-06 總司令 P0 稽核.一）
#
# 為什麼放在 GitHub Actions 而不是本機排程：
#   1. 這支要打 TWSE 與 TPEx 官方端點，runner 的網路與 OpenSSL 版本都比本機穩定
#      （本機 Python 3.13 的嚴格憑證檢查會擋掉 tpex.org.tw，腳本裡有相容處理，
#       但線上跑不需要依賴那條 workaround）。
#   2. 稽核結果要 commit 進 repo 給 App 的設定頁「資料健康」讀，本來就要在 CI 落地。
#
# 2026-09-17：上面那則「還沒 commit」的舊警語已過時刪除——這支排程已在跑
# （`gh run list --workflow=audit.yml` 有實際歷史紀錄），只是 2026-09-10
# `52ab79a7` 誤刪 `scripts/data_audit.py::TWSE_COMPANY` 常數導致第一步
# `build_listed_universe.py` ImportError，整條稽核連續多個交易日跑不出
# 任何結果，已於同日修復（見 PENDING_QUEUE.md【停擺】段落）。本機手動測試：
#   python scripts/build_listed_universe.py
#   python scripts/prune_delisted.py
#   python scripts/data_audit.py
name: 資料一致性稽核

on:
  schedule:
    # 台北時間每晚 23:20（= UTC 15:20），排在 market.yml 的盤後更新之後，
    # 才稽核得到當天的最新資料。
    - cron: "20 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依
        run: pip install requests certifi urllib3

      # 2026-09-17（總司令裁示【記一筆】：監控工具自己也要被監控）：
      # audit.yml曾因data_audit.py誤刪一個常數，讓build_listed_universe.py
      # 第一步就ImportError，連續一週全滅卻沒有留下任何紀錄（GitHub Actions
      # 的log沒人會天天去查）。這支只做import體檢，把結果寫進
      # audit_report.json固定的self_check欄位，永遠exit 0（不擋流程）。
      - name: 稽核管線自檢（import/常數體檢，結果寫進audit_report.json）
        run: python scripts/audit_preflight.py

      - name: 更新官方在市名冊
        run: python scripts/build_listed_universe.py

      - name: 剔除榜單裡已下市/價格過期的股票
        run: python scripts/prune_delisted.py

      # 稽核失敗（違規率>1%）不讓這一步中斷流程——報告本身還是要 commit 進去，
      # 否則使用者在 App 上看不到「今天出問題了」，只會看到一份舊報告。
      # 真正的擋門在冒煙測試（check 39），那才是禁止上線的關卡。
      - name: 全市場一致性稽核
        id: audit
        continue-on-error: true
        run: python scripts/data_audit.py

      # 2026-09-17 改成 if: always()：上面「更新官方在市名冊」／「剔除
      # 榜單」兩步沒有continue-on-error，一旦失敗會直接中止job，這個
      # commit步驟原本因此永遠不會執行——連自檢步驟寫好的self_check欄位
      # 都進不了repo，等於白做。改成always()後，就算後面步驟真的掛了，
      # 至少自檢欄位（跟已經commit過的既有報告內容）能落地，不是繼續
      # 沉默停擺。
      - name: Commit 稽核結果
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audit_report.json data/listed_universe.json scores.json scores_momentum.json scores_future.json
          if git diff --cached --quiet; then
            echo "稽核結果與上次相同，不產生 commit"
          else
            git commit -m "資料稽核：更新 audit_report.json 與在市名冊（每晚排程）"
            git push
          fi

      - name: 稽核未通過就讓這個 job 顯示紅燈
        if: steps.audit.outcome == 'failure'
        run: |
          echo "::error::資料一致性稽核未通過，詳見 data/audit_report.json"
          exit 1
